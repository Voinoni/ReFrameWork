trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.13'

- script: |
    pip install -r requirements.txt
  displayName: Install Dependencies

- script: |
    pytest
  displayName: Run Tests

- script: pytest --html=reports/report.html --self-contained-html
  displayName: Run Tests